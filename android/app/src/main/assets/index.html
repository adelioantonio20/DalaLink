<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DalaLink Luanda — Inteligência de Mobilidade</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --emerald: #0d7c5f;
      --emerald-dark: #095b45;
      --emerald-soft: #ecfdf5;
      --amber: #d97706;
      --amber-soft: #fffbeb;
      --red: #dc2626;
      --red-soft: #fef2f2;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      padding-bottom: 78px;
    }
    body.driver-mode { background: #0b1220; color: #f8fafc; }
    .topbar {
      position: sticky; top: 0; z-index: 20;
      background: var(--emerald); color: #fff;
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.14);
    }
    body.driver-mode .topbar { background: #0f172a; border-bottom: 1px solid #1e293b; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-badge {
      width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;
    }
    .brand-title { font-size: 16px; font-weight: 800; line-height: 1.1; }
    .brand-sub { font-size: 11px; opacity: 0.88; }
    .top-btn {
      background: rgba(255,255,255,0.16); color: #fff; border: 0; border-radius: 10px;
      padding: 7px 10px; font-size: 11px; font-weight: 700;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
    }
    body.driver-mode .card { background: #131c2e; border-color: #233049; color: #f8fafc; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .title { font-size: 15px; font-weight: 800; margin: 0 0 6px 0; }
    .sub { font-size: 12px; color: var(--muted); margin: 0; }
    body.driver-mode .sub { color: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .pill-ok { background: var(--emerald-soft); color: var(--emerald-dark); }
    .pill-warn { background: var(--amber-soft); color: #92400e; }
    .pill-err { background: var(--red-soft); color: var(--red); }
    .pill-muted { background: #f1f5f9; color: #475569; }
    body.driver-mode .pill-ok { background: rgba(16,185,129,0.2); color: #6ee7b7; }
    body.driver-mode .pill-warn { background: rgba(245,158,11,0.2); color: #fcd34d; }
    body.driver-mode .pill-err { background: rgba(239,68,68,0.2); color: #fca5a5; }
    body.driver-mode .pill-muted { background: #1e293b; color: #94a3b8; }
    select, input {
      width: 100%; padding: 10px 11px; border-radius: 12px;
      border: 1px solid #cbd5e1; background: #fff; color: #0f172a;
      font-size: 13px; font-weight: 600;
    }
    body.driver-mode input, body.driver-mode select { background: #0b1220; color: #fff; border-color: #334155; }
    label.lbl { display: block; font-size: 11px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    body.driver-mode label.lbl { color: #94a3b8; }
    .btn {
      width: 100%; border: 0; border-radius: 12px; padding: 12px 14px;
      font-size: 13px; font-weight: 800; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary { background: var(--emerald); color: #fff; }
    .btn-dark { background: #0f172a; color: #fff; }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #cbd5e1; color: var(--ink); }
    body.driver-mode .btn-outline { border-color: #334155; color: #e2e8f0; }
    .btn-danger-outline { background: #fff; border: 1px solid #fecaca; color: var(--red); }
    .btn-sm { padding: 7px 10px; font-size: 11px; width: auto; border-radius: 9px; }
    .chip {
      border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a;
      border-radius: 8px; padding: 6px 8px; font-size: 11px; font-weight: 700;
    }
    body.driver-mode .chip { background: #0b1220; border-color: #334155; color: #e2e8f0; }
    .banner {
      border-radius: 12px; padding: 10px 12px; font-size: 12px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .banner-ok { background: var(--emerald-soft); color: var(--emerald-dark); border: 1px solid #a7f3d0; }
    .banner-err { background: var(--red-soft); color: var(--red); border: 1px solid #fecaca; }
    .safety-box {
      border-radius: 12px; padding: 10px 12px; font-size: 11px; font-weight: 700;
      background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.4); color: #fde68a;
    }
    .map-box { border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #eef6f4; }
    body.driver-mode .map-box { background: #0f1b2d; border-color: #233049; }
    .list-item {
      padding: 9px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px;
    }
    body.driver-mode .list-item { border-color: #1e293b; }
    .list-item:last-child { border-bottom: 0; }
    .kpi { background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    body.driver-mode .kpi { background: #0b1220; border-color: #233049; }
    .kpi-v { font-size: 18px; font-weight: 800; margin-top: 2px; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: #ffffff; border-top: 1px solid var(--border);
      display: grid; grid-template-columns: repeat(4, 1fr);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    body.driver-mode .bottom-nav { background: #0f172a; border-color: #1e293b; }
    .nav-btn {
      border: 0; background: transparent; color: var(--muted);
      font-size: 10px; font-weight: 700; padding: 5px 2px;
      display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 10px;
    }
    .nav-btn.active { color: var(--emerald); background: var(--emerald-soft); }
    body.driver-mode .nav-btn.active { color: #34d399; background: rgba(16,185,129,0.16); }
    .nav-ico { font-size: 15px; line-height: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">DL</div>
      <div>
        <div class="brand-title">DalaLink Luanda</div>
        <div class="brand-sub" id="top-sub">Inteligência de Mobilidade Urbana</div>
      </div>
    </div>
    <button class="top-btn" onclick="resetDemo()">Repor Demo</button>
  </header>

  <div class="wrap">
    <div id="banner" style="display:none"></div>
    <div id="root"></div>
  </div>

  <nav class="bottom-nav" id="bnav"></nav>

  <script>
    const STORAGE_KEY = 'dalalink_info_mvp_v2';

    const ZONES = [
      { name: 'Gamek', muni: 'Luanda', x: 245, y: 232 },
      { name: 'Rocha Gamek', muni: 'Luanda', x: 208, y: 214 },
      { name: 'Golf 2', muni: 'Kilamba Kiaxi', x: 345, y: 242 },
      { name: 'Maianga', muni: 'Luanda', x: 312, y: 102 },
      { name: 'Alvalade', muni: 'Luanda', x: 345, y: 88 },
      { name: 'Mutamba', muni: 'Luanda', x: 295, y: 62 },
      { name: 'Aeroporto', muni: 'Luanda', x: 300, y: 162 },
      { name: 'Talatona', muni: 'Talatona', x: 145, y: 292 },
      { name: 'Kilamba', muni: 'Belas', x: 375, y: 360 },
      { name: 'Viana', muni: 'Viana', x: 520, y: 262 },
    ];

    const ROUTES = [
      { code: 'VIA-GMK-MAI', origin: 'Gamek', dest: 'Maianga', road: 'Trânsito moderado' },
      { code: 'VIA-RGM-MAI', origin: 'Rocha Gamek', dest: 'Maianga', road: 'Circulação normal' },
      { code: 'VIA-GLF-MAI', origin: 'Golf 2', dest: 'Maianga', road: 'Trânsito intenso' },
      { code: 'VIA-ALV-MUT', origin: 'Alvalade', dest: 'Mutamba', road: 'Circulação normal' },
      { code: 'VIA-TAL-MAI', origin: 'Talatona', dest: 'Maianga', road: 'Trânsito moderado' },
      { code: 'VIA-GMK-AER', origin: 'Gamek', dest: 'Aeroporto', road: 'Circulação normal' },
      { code: 'VIA-VIA-KIL', origin: 'Viana', dest: 'Kilamba', road: 'Circulação normal' },
    ];

    const nowMs = () => Date.now();
    const minAgo = (m) => Date.now() - m * 60000;
    const minFromNow = (m) => Date.now() + m * 60000;
    const fmtClock = (ms) => new Date(ms).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });

    function initialState() {
      return {
        env: 'passenger', // passenger | driver | field | admin
        origin: 'Gamek',
        dest: 'Maianga',
        passCount: 1,
        drvOrigin: 'Golf 2',
        drvDest: 'Maianga',
        drvStatus: 'AVAILABLE',
        cfg: {
          recent_min: 15,
          stale_min: 45,
          demand_mod: 5,
          demand_high: 15,
          supply_mod: 3,
          supply_high: 8,
          imbalance_ratio: 3.0,
        },
        intentions: [
          { id: 1, who: 'Ana Paula', origin: 'Gamek', dest: 'Maianga', count: 2, status: 'DECLARED', ts: minAgo(5), exp: minFromNow(55), demo: true },
          { id: 2, who: 'João Manuel', origin: 'Alvalade', dest: 'Mutamba', count: 1, status: 'DECLARED', ts: minAgo(6), exp: minFromNow(54), demo: true },
        ],
        myIntentionId: null,
        driverReports: [
          { id: 1, driver: 'Carlos Eduardo', origin: 'Gamek', dest: 'Maianga', status: 'AVAILABLE', seats: 4, ts: minAgo(4), exp: minFromNow(56), demo: true },
          { id: 2, driver: 'Fernando Quiosa', origin: 'Alvalade', dest: 'Mutamba', status: 'AT_STOP', seats: 12, ts: minAgo(3), exp: minFromNow(57), demo: true },
        ],
        observations: [
          { id: 1, origin: 'Gamek', dest: 'Maianga', taxis: 5, passengers: 22, wait: 14, road: 'Trânsito moderado', status: 'VALIDATED', ts: minAgo(4), exp: minFromNow(41), notes: '[DEMO] Fila elevada no Gamek sentido Maianga.', demo: true },
          { id: 2, origin: 'Rocha Gamek', dest: 'Maianga', taxis: 6, passengers: 8, wait: 6, road: 'Circulação normal', status: 'VALIDATED', ts: minAgo(6), exp: minFromNow(39), notes: '[DEMO] Alternativa Rocha Gamek com boa fluidez.', demo: true },
          { id: 3, origin: 'Talatona', dest: 'Maianga', taxis: 2, passengers: 11, wait: 10, road: 'Trânsito moderado', status: 'VALIDATED', ts: minAgo(25), exp: minFromNow(20), notes: '[DEMO] Registo com 25 min (desactualizado).', demo: true },
          { id: 4, origin: 'Golf 2', dest: 'Maianga', taxis: 4, passengers: 18, wait: 15, road: 'Trânsito intenso', status: 'PENDING', ts: minAgo(3), exp: minFromNow(42), notes: '[DEMO] Observação pendente de validação administrativa.', demo: true },
        ],
        audit: [
          { time: fmtClock(nowMs()), action: 'INFO_MVP_INIT', detail: 'Plataforma de Inteligência de Mobilidade activa (sem pagamentos/carteiras).' }
        ],
        nextId: 50,
      };
    }

    let state = (() => {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        return s ? Object.assign(initialState(), JSON.parse(s)) : initialState();
      } catch {
        return initialState();
      }
    })();

    function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} }
    function resetDemo() { state = initialState(); save(); showMsg('Dados de demonstração repostos.'); render(); }
    function addAudit(action, detail) { state.audit.unshift({ time: fmtClock(nowMs()), action, detail }); }
    function showMsg(text, type = 'ok') {
      const b = document.getElementById('banner');
      b.style.display = 'flex';
      b.className = `banner ${type === 'ok' ? 'banner-ok' : 'banner-err'}`;
      b.innerHTML = `<span>${text}</span><button onclick="document.getElementById('banner').style.display='none'" style="border:0;background:transparent;font-weight:800;color:inherit">✕</button>`;
    }

    function freshnessOf(ts, exp) {
      const now = nowMs();
      const ageMin = (now - ts) / 60000;
      if (exp && exp <= now) return 'EXPIRED';
      if (ageMin > state.cfg.stale_min) return 'EXPIRED';
      if (ageMin > state.cfg.recent_min) return 'STALE';
      return 'RECENT';
    }

    function evaluateCorridor(o, d) {
      const activeInts = state.intentions.filter(i => i.origin === o && i.dest === d && (i.status === 'DECLARED' || i.status === 'CONFIRMED_AT_STOP') && freshnessOf(i.ts, i.exp) !== 'EXPIRED');
      const activeObs = state.observations.filter(x => x.origin === o && x.dest === d && x.status === 'VALIDATED' && freshnessOf(x.ts, x.exp) !== 'EXPIRED').sort((a,b) => b.ts - a.ts);
      const activeDrvs = state.driverReports.filter(x => x.origin === o && x.dest === d && (x.status === 'AVAILABLE' || x.status === 'AT_STOP') && freshnessOf(x.ts, x.exp) !== 'EXPIRED');

      const declDem = activeInts.filter(i => i.status === 'DECLARED').reduce((s,i) => s + i.count, 0);
      const confPass = activeInts.filter(i => i.status === 'CONFIRMED_AT_STOP').reduce((s,i) => s + i.count, 0);
      const obsDem = activeObs.length ? activeObs[0].passengers : 0;
      const obsSup = activeObs.length ? activeObs[0].taxis : 0;
      const declSup = new Set(activeDrvs.map(x => x.driver)).size;

      const confDem = confPass + obsDem;
      const estDem = declDem + confDem;
      const totSup = declSup + obsSup;

      const times = [...activeInts.map(x => x.ts), ...activeObs.map(x => x.ts), ...activeDrvs.map(x => x.ts)];
      const freshList = [...activeInts, ...activeObs, ...activeDrvs].map(x => freshnessOf(x.ts, x.exp));

      if (times.length === 0 || (estDem === 0 && totSup === 0)) {
        return {
          origin: o, dest: d, sufficient: false,
          msg: 'Informação insuficiente para esta via.',
          estDem: 0, declDem: 0, confDem: 0, declSup: 0, obsSup: 0, totSup: 0,
          demandLevel: 'INSUFFICIENT', supplyLevel: 'INSUFFICIENT',
          freshness: 'EXPIRED', sources: [], updated: null, wait: null,
          advisoryPass: 'Informação insuficiente para esta via. Pode declarar a sua intenção abaixo.',
          advisoryDrv: 'Informação insuficiente para esta via.',
        };
      }

      const latest = Math.max(...times);
      const freshness = freshList.includes('RECENT') ? 'RECENT' : 'STALE';
      const demandLevel = estDem >= state.cfg.demand_high ? 'PROCURA_ELEVADA' : estDem >= state.cfg.demand_mod ? 'PROCURA_MODERADA' : 'PROCURA_BAIXA';
      const supplyLevel = totSup >= state.cfg.supply_high ? 'OFERTA_ELEVADA' : totSup >= state.cfg.supply_mod ? 'OFERTA_MODERADA' : 'OFERTA_REDUZIDA';
      const ratio = totSup > 0 ? +(estDem / totSup).toFixed(2) : null;
      const imbalanced = (ratio !== null && ratio >= state.cfg.imbalance_ratio) || (estDem >= state.cfg.demand_mod && totSup === 0);

      const sources = [];
      if (declDem > 0) sources.push('Declarado (Passageiros)');
      if (confPass > 0) sources.push('Confirmado na Paragem');
      if (activeObs.length) sources.push('Observado em Campo');
      if (declSup > 0) sources.push('Declarado (Motoristas)');

      const wait = activeObs.length && activeObs[0].wait ? activeObs[0].wait : (ratio ? Math.max(4, Math.min(45, Math.round(ratio * 4.5))) : null);
      const prefix = freshness === 'STALE' ? '[Desactualizado] ' : '';

      return {
        origin: o, dest: d, sufficient: true,
        estDem, declDem, confDem, declSup, obsSup, totSup, ratio, imbalanced,
        demandLevel, supplyLevel, freshness, sources, updated: latest, wait,
        confidence: activeObs.length && freshness === 'RECENT' ? 'ALTA' : (sources.length >= 2 && freshness === 'RECENT' ? 'MÉDIA' : 'BAIXA'),
        advisoryPass: prefix + (imbalanced ? 'Procura estimada elevada face à oferta sinalizada. Compare paragens próximas.' : supplyLevel === 'OFERTA_ELEVADA' ? 'Boa disponibilidade estimada de táxis nesta via.' : 'Movimento moderado estimado nesta via.'),
        advisoryDrv: prefix + (imbalanced ? 'Possível oportunidade de procura elevada nesta via.' : demandLevel === 'PROCURA_ELEVADA' ? 'Procura estimada elevada com oferta activa.' : 'Procura estimada moderada/baixa.'),
      };
    }

    function renderMap(showHeat) {
      const dark = state.env === 'driver';
      const oz = ZONES.find(z => z.name === state.origin) || ZONES[0];
      const dz = ZONES.find(z => z.name === state.dest) || ZONES[3];
      const txt = dark ? '#94a3b8' : '#475569';
      const road = dark ? '#26354d' : '#cbd5e1';

      const heatSvg = showHeat ? ZONES.map(z => {
        const rs = ROUTES.filter(r => r.origin === z.name).map(r => evaluateCorridor(r.origin, r.dest));
        const dem = rs.reduce((s, r) => s + r.estDem, 0);
        if (dem === 0) return '';
        const col = dem >= state.cfg.demand_high ? '#dc2626' : dem >= state.cfg.demand_mod ? '#d97706' : '#0d7c5f';
        return `<circle cx="${z.x}" cy="${z.y}" r="${dem >= state.cfg.demand_high ? 30 : 20}" fill="${col}" fill-opacity="0.24" stroke="${col}" stroke-width="1.2"/>`;
      }).join('') : '';

      const stopsSvg = ZONES.map(z => `
        <circle cx="${z.x}" cy="${z.y}" r="4.5" fill="${txt}" opacity="0.75"/>
        <text x="${z.x + 6}" y="${z.y + 3}" font-size="10.5" fill="${txt}" font-weight="700">${z.name}</text>
      `).join('');

      const lineSvg = state.env === 'passenger' ? `
        <line x1="${oz.x}" y1="${oz.y}" x2="${dz.x}" y2="${dz.y}" stroke="#0d7c5f" stroke-width="3" stroke-dasharray="6 5"/>
        <circle cx="${oz.x}" cy="${oz.y}" r="9" fill="#0d7c5f" stroke="#fff" stroke-width="2"/>
        <text x="${oz.x}" y="${oz.y+3}" text-anchor="middle" font-size="9" fill="#fff" font-weight="800">O</text>
        <circle cx="${dz.x}" cy="${dz.y}" r="9" fill="#d97706" stroke="#fff" stroke-width="2"/>
        <text x="${dz.x}" y="${dz.y+3}" text-anchor="middle" font-size="9" fill="#fff" font-weight="800">D</text>
      ` : '';

      return `
        <div class="map-box">
          <svg viewBox="0 0 580 385" style="width:100%;height:195px;display:block">
            <path d="M0,0 L265,0 C240,65 185,120 140,210 C100,285 60,340 35,385 L0,385 Z" fill="#0ea5e9" fill-opacity="0.14"/>
            <text x="14" y="30" font-size="10.5" fill="${txt}" opacity="0.8" font-weight="700">Luanda • Dados Agregados</text>
            <path d="M295,62 L312,102 L300,162 L245,232 L145,292 M245,232 L520,262 M145,292 L375,360" fill="none" stroke="${road}" stroke-width="2.6"/>
            ${heatSvg}${stopsSvg}${lineSvg}
          </svg>
        </div>
      `;
    }

    // --- ACTIONS ---
    function declareIntention() {
      if (state.origin === state.dest) return showMsg('Escolha origem e destino diferentes.', 'err');
      const existing = state.intentions.find(i => i.id === state.myIntentionId && (i.status === 'DECLARED' || i.status === 'CONFIRMED_AT_STOP'));
      if (existing && existing.origin === state.origin && existing.dest === state.dest) {
        return showMsg('Já declarou intenção activa para esta via (duplicação impedida).', 'err');
      }
      if (existing) existing.status = 'CANCELLED';
      const id = state.nextId++;
      state.intentions.unshift({
        id, who: 'Eu (Mateus)', origin: state.origin, dest: state.dest, count: state.passCount,
        status: 'DECLARED', ts: nowMs(), exp: minFromNow(60), demo: false
      });
      state.myIntentionId = id;
      addAudit('INTENTION_DECLARED', `${state.origin} → ${state.dest} (${state.passCount} pass.)`);
      save();
      showMsg(`Intenção declarada para ${state.origin} → ${state.dest}. Quando chegar à paragem, confirme a presença.`);
      render();
    }

    function confirmAtStop() {
      const my = state.intentions.find(i => i.id === state.myIntentionId);
      if (!my) return;
      my.status = 'CONFIRMED_AT_STOP'; my.ts = nowMs(); my.exp = minFromNow(60);
      addAudit('CONFIRMED_AT_STOP', `${my.origin} → ${my.dest}`);
      save(); showMsg(`Presença física confirmada na paragem (${my.origin})!`); render();
    }

    function cancelIntention() {
      const my = state.intentions.find(i => i.id === state.myIntentionId);
      if (my) my.status = 'CANCELLED';
      state.myIntentionId = null;
      addAudit('INTENTION_CANCELLED', 'Cancelado pelo passageiro');
      save(); showMsg('Intenção de viagem cancelada.'); render();
    }

    function saveDriverAvail() {
      state.driverReports = state.driverReports.filter(r => r.driver !== 'Eu (Motorista)');
      if (state.drvStatus !== 'UNAVAILABLE') {
        state.driverReports.unshift({
          id: state.nextId++, driver: 'Eu (Motorista)', origin: state.drvOrigin, dest: state.drvDest,
          status: state.drvStatus, seats: 4, ts: nowMs(), exp: minFromNow(60), demo: false
        });
      }
      addAudit('DRIVER_AVAILABILITY', `${state.drvOrigin} → ${state.drvDest} (${state.drvStatus})`);
      save();
      showMsg(`Disponibilidade actualizada: ${state.drvOrigin} → ${state.drvDest} (${state.drvStatus}).`);
      render();
    }

    function submitFieldObs() {
      const o = document.getElementById('obs-o')?.value || 'Gamek';
      const d = document.getElementById('obs-d')?.value || 'Maianga';
      const taxis = Number(document.getElementById('obs-t')?.value || 0);
      const pass = Number(document.getElementById('obs-p')?.value || 0);
      const wait = Number(document.getElementById('obs-w')?.value || 10);
      state.observations.unshift({
        id: state.nextId++, origin: o, dest: d, taxis, passengers: pass, wait,
        road: 'Trânsito moderado', status: 'VALIDATED', ts: nowMs(), exp: minFromNow(45),
        notes: 'Observação presencial registada em campo.', demo: false
      });
      addAudit('FIELD_OBSERVATION', `${o} → ${d}: ${taxis} táxis, ${pass} pass. (Validada)`);
      save();
      showMsg(`Observação de campo validada: ${o} → ${d} (${taxis} táxis, ${pass} pass.).`);
      render();
    }

    function validatePendingObs(id, decision) {
      const obs = state.observations.find(x => x.id === id); if (!obs) return;
      obs.status = decision;
      addAudit('OBS_' + decision, `${obs.origin} → ${obs.dest}`);
      save(); showMsg(`Observação #${id} marcada como ${decision}.`); render();
    }

    function saveThresholds() {
      state.cfg.recent_min = Number(document.getElementById('cfg-rec')?.value || 15);
      state.cfg.demand_high = Number(document.getElementById('cfg-dh')?.value || 15);
      state.cfg.supply_high = Number(document.getElementById('cfg-sh')?.value || 8);
      addAudit('THRESHOLDS_UPDATED', `recent=${state.cfg.recent_min}m, demand_high=${state.cfg.demand_high}`);
      save(); showMsg('Limites configuráveis actualizados!'); render();
    }

    // --- VIEWS ---
    function viewPassenger() {
      const c = evaluateCorridor(state.origin, state.dest);
      const my = state.intentions.find(i => i.id === state.myIntentionId && (i.status === 'DECLARED' || i.status === 'CONFIRMED_AT_STOP'));
      const alts = ROUTES.filter(r => r.dest === state.dest && r.origin !== state.origin).map(r => evaluateCorridor(r.origin, r.dest));

      const dPill = c.demandLevel === 'PROCURA_ELEVADA' ? 'pill-err' : c.demandLevel === 'PROCURA_MODERADA' ? 'pill-warn' : c.demandLevel === 'PROCURA_BAIXA' ? 'pill-ok' : 'pill-muted';
      const sPill = c.supplyLevel === 'OFERTA_ELEVADA' ? 'pill-ok' : c.supplyLevel === 'OFERTA_MODERADA' ? 'pill-warn' : c.supplyLevel === 'OFERTA_REDUZIDA' ? 'pill-err' : 'pill-muted';

      return `
        <div class="card" style="display:flex;flex-direction:column;gap:9px">
          <div>
            <div style="font-size:10px;font-weight:800;color:var(--emerald);text-transform:uppercase">Antes de sair de casa</div>
            <div class="title" style="margin:2px 0 0">Como está a sua via?</div>
          </div>
          <div class="grid2">
            <div>
              <label class="lbl">De onde vais sair?</label>
              <select onchange="state.origin=this.value;save();render()">
                ${ZONES.map(z => `<option value="${z.name}" ${z.name===state.origin?'selected':''}>${z.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="lbl">Para onde pretendes ir?</label>
              <select onchange="state.dest=this.value;save();render()">
                ${ZONES.map(z => `<option value="${z.name}" ${z.name===state.dest?'selected':''}>${z.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            ${[['Gamek','Maianga'],['Rocha Gamek','Maianga'],['Talatona','Maianga'],['Viana','Kilamba']].map(([o,d]) => `
              <button class="chip" onclick="state.origin='${o}';state.dest='${d}';save();render()">${o} → ${d}</button>
            `).join('')}
          </div>
        </div>

        <div class="card" style="display:flex;flex-direction:column;gap:10px">
          <div class="row">
            <div class="title" style="margin:0">${c.origin} → ${c.dest}</div>
            <span class="pill ${dPill}">${c.sufficient ? c.demandLevel.replace('_',' ') : 'Sem dados'}</span>
          </div>

          ${!c.sufficient ? `
            <div class="kpi">
              <strong style="font-size:13px">${c.msg}</strong>
              <p class="sub" style="margin-top:4px">${c.advisoryPass}</p>
            </div>
          ` : `
            ${c.freshness === 'STALE' ? `<div class="banner banner-err" style="background:var(--amber-soft);color:#92400e;border-color:#fde68a">Atenção: dados desta via estão desactualizados.</div>` : ''}
            <div class="grid3">
              <div class="kpi"><div class="sub">Passageiros</div><div class="kpi-v">${c.estDem}</div><div class="sub">${c.confDem} conf.</div></div>
              <div class="kpi"><div class="sub">Táxis</div><div class="kpi-v" style="color:var(--emerald)">${c.totSup}</div><div class="sub">${c.obsSup} obs.</div></div>
              <div class="kpi"><div class="sub">Espera</div><div class="kpi-v">${c.wait ? '~'+c.wait+'m' : '—'}</div><div class="sub">Conf. ${c.confidence}</div></div>
            </div>
            <div style="font-size:12px;font-weight:600">${c.advisoryPass}</div>
            <div class="row" style="font-size:11px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px">
              <span>Actualizado: <strong>${fmtClock(c.updated)}</strong> (${c.freshness === 'RECENT' ? 'Recente' : 'Desact.'})</span>
              <span class="pill ${sPill}">${c.supplyLevel.replace('_',' ')}</span>
            </div>
            <div class="sub">Fontes: ${c.sources.join(', ')}</div>
          `}

          ${alts.length ? `
            <div style="border-top:1px solid var(--border);padding-top:8px">
              <div style="font-size:11px;font-weight:800;margin-bottom:6px">Paragens alternativas para ${c.dest}:</div>
              <div class="grid2">
                ${alts.map(a => `
                  <button class="kpi" style="text-align:left;cursor:pointer" onclick="state.origin='${a.origin}';save();render()">
                    <strong style="font-size:12px">${a.origin}</strong>
                    <div class="sub">${a.sufficient ? a.estDem + ' pass. • ' + a.totSup + ' táxis' : 'Sem dados'}</div>
                  </button>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>

        ${my ? `
          <div class="card" style="border-color:var(--emerald);background:var(--emerald-soft)">
            <div class="row">
              <strong style="font-size:12px;color:var(--emerald-dark)">A SUA INTENÇÃO ACTIVA</strong>
              <span class="pill pill-ok">${my.status === 'CONFIRMED_AT_STOP' ? 'Confirmado na Paragem' : 'Declarado'}</span>
            </div>
            <div class="title" style="margin:6px 0 4px">${my.origin} → ${my.dest} (${my.count} p.)</div>
            <div class="grid2" style="margin-top:8px">
              ${my.status !== 'CONFIRMED_AT_STOP' ? `<button class="btn btn-primary" onclick="confirmAtStop()">Estou na Paragem</button>` : ''}
              <button class="btn btn-danger-outline" style="${my.status==='CONFIRMED_AT_STOP'?'grid-column:span 2':''}" onclick="cancelIntention()">Cancelar</button>
            </div>
          </div>
        ` : `
          <div class="card">
            <div class="row" style="margin-bottom:8px">
              <div><strong style="font-size:13px">Declarar Intenção de Viajar</strong><div class="sub">Gratuito • Ajuda a equilibrar a via</div></div>
              <input type="number" min="1" max="10" value="${state.passCount}" onchange="state.passCount=Math.max(1,Number(this.value))" style="width:58px;text-align:center"/>
            </div>
            <button class="btn btn-dark" onclick="declareIntention()">Declarar (${state.origin} → ${state.dest})</button>
          </div>
        `}

        ${renderMap(true)}
      `;
    }

    function viewDriver() {
      const evaluated = ROUTES.map(r => evaluateCorridor(r.origin, r.dest)).sort((a,b) => b.estDem - a.estDem);
      return `
        <div class="safety-box">
          ⚠️ Segurança rodoviária: consulte esta informação apenas com o veículo imobilizado. Indicadores são estimativas baseadas nos últimos registos.
        </div>

        <div class="card" style="display:flex;flex-direction:column;gap:8px">
          <div class="title" style="margin:0">Indicar Disponibilidade na Via</div>
          <div class="grid2">
            <div>
              <label class="lbl">Zona Actual</label>
              <select onchange="state.drvOrigin=this.value;save()">
                ${ZONES.map(z => `<option value="${z.name}" ${z.name===state.drvOrigin?'selected':''}>${z.name}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="lbl">Destino da Via</label>
              <select onchange="state.drvDest=this.value;save()">
                ${ZONES.map(z => `<option value="${z.name}" ${z.name===state.drvDest?'selected':''}>${z.name}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="grid2">
            <select onchange="state.drvStatus=this.value;save()">
              <option value="AVAILABLE" ${state.drvStatus==='AVAILABLE'?'selected':''}>Disponível</option>
              <option value="AT_STOP" ${state.drvStatus==='AT_STOP'?'selected':''}>Na Paragem</option>
              <option value="UNAVAILABLE" ${state.drvStatus==='UNAVAILABLE'?'selected':''}>Indisponível</option>
            </select>
            <button class="btn btn-primary" onclick="saveDriverAvail()">Actualizar Estado</button>
          </div>
        </div>

        ${renderMap(true)}

        <div class="card">
          <div class="title">Procura Estimada por Via (Luanda)</div>
          ${evaluated.map(r => `
            <div class="list-item" style="flex-direction:column;align-items:stretch;gap:4px">
              <div class="row">
                <strong>${r.origin} → ${r.dest}</strong>
                <span class="pill ${r.demandLevel==='PROCURA_ELEVADA'?'pill-err':r.demandLevel==='PROCURA_MODERADA'?'pill-warn':r.sufficient?'pill-ok':'pill-muted'}">
                  ${r.sufficient ? r.demandLevel.replace('_',' ') : 'Insuficiente'}
                </span>
              </div>
              <div class="sub">${r.advisoryDrv}</div>
              ${r.sufficient ? `<div class="sub">${r.estDem} pass. est. (${r.confDem} conf.) • ${r.totSup} táxis • Act. ${fmtClock(r.updated)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      `;
    }

    function viewField() {
      const pending = state.observations.filter(o => o.status === 'PENDING');
      return `
        <div class="card" style="display:flex;flex-direction:column;gap:9px">
          <div class="title" style="margin:0">Registar Observação Presencial de Campo</div>
          <div class="grid2">
            <div>
              <label class="lbl">Paragem / Origem</label>
              <select id="obs-o">${ZONES.map(z => `<option value="${z.name}" ${z.name==='Gamek'?'selected':''}>${z.name}</option>`).join('')}</select>
            </div>
            <div>
              <label class="lbl">Destino da Via</label>
              <select id="obs-d">${ZONES.map(z => `<option value="${z.name}" ${z.name==='Maianga'?'selected':''}>${z.name}</option>`).join('')}</select>
            </div>
          </div>
          <div class="grid3">
            <div><label class="lbl">Táxis Obs.</label><input id="obs-t" type="number" value="15"/></div>
            <div><label class="lbl">Pass. Espera</label><input id="obs-p" type="number" value="32"/></div>
            <div><label class="lbl">Espera (m)</label><input id="obs-w" type="number" value="12"/></div>
          </div>
          <button class="btn btn-primary" onclick="submitFieldObs()">Registar e Validar Observação</button>
        </div>

        <div class="card">
          <div class="title">Observações Pendentes de Validação (${pending.length})</div>
          ${pending.map(o => `
            <div class="list-item">
              <div><strong>${o.origin} → ${o.dest}</strong><div class="sub">${o.passengers} pass. • ${o.taxis} táxis • ${fmtClock(o.ts)}</div></div>
              <div style="display:flex;gap:4px">
                <button class="btn btn-primary btn-sm" onclick="validatePendingObs(${o.id},'VALIDATED')">Validar</button>
                <button class="btn btn-danger-outline btn-sm" onclick="validatePendingObs(${o.id},'REJECTED')">Rejeitar</button>
              </div>
            </div>
          `).join('') || `<p class="sub">Todas as observações de campo estão validadas.</p>`}
        </div>
      `;
    }

    function viewAdmin() {
      const totalInts = state.intentions.filter(i => i.status === 'DECLARED' || i.status === 'CONFIRMED_AT_STOP').length;
      const confPass = state.intentions.filter(i => i.status === 'CONFIRMED_AT_STOP').reduce((s,i)=>s+i.count, 0) +
        state.observations.filter(o => o.status === 'VALIDATED').reduce((s,o)=>s+o.passengers, 0);
      return `
        <div class="grid2">
          <div class="kpi"><div class="sub">Intenções Activas</div><div class="kpi-v">${totalInts}</div><div class="sub">Confirmados: ${confPass}</div></div>
          <div class="kpi"><div class="sub">Observações Valid.</div><div class="kpi-v" style="color:var(--emerald)">${state.observations.filter(o=>o.status==='VALIDATED').length}</div><div class="sub">Pendentes: ${state.observations.filter(o=>o.status==='PENDING').length}</div></div>
        </div>

        <div class="card" style="display:flex;flex-direction:column;gap:8px">
          <div class="title" style="margin:0">Limites Configuráveis (Procura, Oferta e Expiração)</div>
          <div class="grid3">
            <div><label class="lbl">Recente (min)</label><input id="cfg-rec" type="number" value="${state.cfg.recent_min}"/></div>
            <div><label class="lbl">Proc. Alta</label><input id="cfg-dh" type="number" value="${state.cfg.demand_high}"/></div>
            <div><label class="lbl">Oferta Alta</label><input id="cfg-sh" type="number" value="${state.cfg.supply_high}"/></div>
          </div>
          <button class="btn btn-dark" onclick="saveThresholds()">Guardar Limites</button>
        </div>

        <div class="card">
          <div class="title">Audit Logs Recentes</div>
          ${state.audit.slice(0, 10).map(l => `
            <div class="list-item" style="flex-direction:column;align-items:flex-start;gap:2px">
              <strong class="mono" style="font-size:11px">${l.time} • ${l.action}</strong>
              <span class="sub">${l.detail}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function render() {
      document.body.className = state.env === 'driver' ? 'driver-mode' : '';
      const subMap = {
        passenger: 'Passageiro • Consulte antes de sair',
        driver: 'Motorista • Onde existe procura',
        field: 'Recolha de Campo • Observação',
        admin: 'Administração • Controlo & Limites',
      };
      document.getElementById('top-sub').textContent = subMap[state.env];

      document.getElementById('bnav').innerHTML = [
        { id: 'passenger', ico: '🧭', lbl: 'Passageiro' },
        { id: 'driver', ico: '🚖', lbl: 'Motorista' },
        { id: 'field', ico: '📋', lbl: 'Campo' },
        { id: 'admin', ico: '📊', lbl: 'Admin' },
      ].map(n => `
        <button class="nav-btn ${state.env === n.id ? 'active' : ''}" onclick="state.env='${n.id}';save();render()">
          <span class="nav-ico">${n.ico}</span><span>${n.lbl}</span>
        </button>
      `).join('');

      const root = document.getElementById('root');
      if (state.env === 'passenger') root.innerHTML = viewPassenger();
      else if (state.env === 'driver') root.innerHTML = viewDriver();
      else if (state.env === 'field') root.innerHTML = viewField();
      else root.innerHTML = viewAdmin();
    }

    render();
  </script>
</body>
</html>
