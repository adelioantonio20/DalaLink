services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: dalalink_postgis
    environment:
      POSTGRES_DB: dalalink
      POSTGRES_USER: dalalink
      POSTGRES_PASSWORD: dalalink_dev_password
      TZ: Africa/Luanda
    ports:
      - "5432:5432"
    volumes:
      - dalalink_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dalalink -d dalalink"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: dalalink_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://dalalink:dalalink_dev_password@postgres:5432/dalalink
      TIMEZONE: Africa/Luanda
      CURRENCY: AOA
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: dalalink_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  dalalink_pgdata:
